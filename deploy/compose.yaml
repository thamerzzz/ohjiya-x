# Production stack for a VPS: the app plus Caddy for HTTPS.
# Run from the repo root:  docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # The app rejects any Host header not listed here (DNS-rebinding guard).
      - GEV_ALLOWED_HOSTS=${SITE_DOMAIN:-x.ohjiya.sa}
      # Provider Settings refuses proxied requests on purpose: no one can open
      # the key panel from the internet. Keys come from deploy/.env below.
      - GEV_KEY_SETUP_TRUSTED_PEERS=none
      # Ohjiya X accounts (secrets come from deploy/.env).
      - OHJIYA_AUTH=${OHJIYA_AUTH:-off}
      - OHJIYA_APP_URL=https://${SITE_DOMAIN:-x.ohjiya.sa}
    env_file:
      - .env
    volumes:
      - app-data:/app/.gev-cache
    # Not published to the host: only Caddy can reach it.
    expose:
      - "4173"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  app-data:
  caddy-data:
  caddy-config:
